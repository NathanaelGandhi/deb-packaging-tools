[project]
name = "ng-debpkg"
version = "0.1.0"
description = "Debian Packaging Tools"
readme = "README.md"
authors = [
    { name = "Nathanael Gandhi", email = "nat11public@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "argparse>=1.4.0",
    "bloom>=0.12.0",
]

[project.scripts]
ng-debpkg = "ng_debpkg:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
